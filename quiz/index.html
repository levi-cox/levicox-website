  "week": [
   "Upper Strength + Steady State",
   "Lower Strength + Sled",
   "Conditioning",
   "Full Body Density + Walk"
  ],
  "blurb": "This is a fat-loss week built from four different jobs: an upper-body strength day that keeps your muscle and ends with steady-state cardio, a lower-body strength day that finishes with sled pushes, a conditioning day with a four-exercise circuit and bike intervals and a full-body density day with paired supersets and an incline walk.",
  "stan": "https://stan.store/levicox/p/lose-fat-4day-strength--conditioning"
 },
 "fat-5": {
  "slug": "lose-fat-5-day",
  "title": "Lose Fat: 5-Day Strength + Conditioning",
  "tagline": "Five days. Lift, burn, repeat. Built for a cut.",
  "level": "intermediate",
  "weeks": 12,
  "days": 5,
  "minutes": 50,
  "tier": "pro",
  "week": [
   "Upper",
   "Lower",
   "Steady State + Mobility",
   "Full Body Density",
   "Intervals + Carries"
  ],
  "blurb": "Five days a week gives you the full recipe for a fat-loss phase: two strength days to protect your muscle, a steady-state day with mobility for low-cost calorie burn, a density day with paired supersets and sled work and an interval day with carries and a little arm work.",
  "stan": "https://stan.store/levicox/p/lose-fat-5day-strength--conditioning"
 },
 "general-4": {
  "slug": "foundations",
  "title": "Foundations",
  "tagline": "The 4-day base program.",
  "level": "beginner",
  "weeks": null,
  "days": 4,
  "minutes": null,
  "tier": "free",
  "week": [],
  "blurb": "A simple 4-day program that covers your whole body and builds the habit. It is the base program in the Levi Cox Fitness app.",
  "stan": null
 }
};

const Q = [
  { key: "goal", n: "Question 1 of 3", title: "What's your main goal?", sub: "Pick the one that matters most right now.", opts: [
    ["muscle", "Build muscle", "Add size and shape"], ["strength", "Get stronger", "Chase a bigger squat, bench and deadlift"],
    ["fat", "Lose fat", "Lean out and keep your muscle"], ["hybrid", "Hybrid performance", "Lift heavy and run well"], ["general", "General fitness", "Feel strong, fit and mobile"]] },
  { key: "days", n: "Question 2 of 3", title: "How many days a week can you train?", sub: "Be honest. The best program is the one you finish.", opts: [
    ["2", "2 days", "Short and focused"], ["3", "3 days", "The sweet spot for most people"], ["4", "4 days", "Serious training"], ["5", "5 days", "Maximum volume"]] },
  { key: "exp", n: "Question 3 of 3", title: "How long have you trained consistently?", sub: "Consistently means most weeks, with a plan.", opts: [
    ["new", "Under a year", "New, or coming back after a break"], ["vet", "A year or more", "You know your way around a gym"]] },
];
const GOALNAME = { muscle: "Build muscle", strength: "Get stronger", fat: "Lose fat", hybrid: "Hybrid performance", general: "General fitness" };
const el = document.getElementById("app");
let step = 0; const ans = {};

function h(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function focusHeading() { const t = el.querySelector("[data-focus]"); if (t) { t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: false }); } }

function render() {
  if (step >= Q.length) return result(pick());
  const q = Q[step];
  el.innerHTML = `
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${step}" aria-label="Quiz progress"><i style="width:${(step / Q.length) * 100}%"></i></div>
    <div class="lab stepno">${q.n}</div>
    <h1 class="d" data-focus>${h(q.title)}</h1>
    <p class="mut sub">${h(q.sub)}</p>
    <ul class="opts">${q.opts.map(o => `<li><button type="button" class="opt" data-v="${o[0]}"><span><b>${h(o[1])}</b><span class="s">${h(o[2])}</span></span><span class="arr" aria-hidden="true">→</span></button></li>`).join("")}</ul>
    ${step > 0 ? '<div class="nav2"><button type="button" class="linkbtn" id="back">Back</button></div>' : ""}`;
  el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { ans[q.key] = b.dataset.v; step++; render(); }));
  const back = document.getElementById("back"); if (back) back.addEventListener("click", () => { step--; render(); });
  if (step > 0) focusHeading();
}

/* Pick the primary match and an alternative from goal, days and experience. */
function pick() {
  const g = ans.goal, d = +ans.days, vet = ans.exp === "vet";
  const get = n => PROGRAMS[g + "-" + n];
  let main = get(d), alt = null, note = "";
  if (!vet && d >= 4 && g !== "general") {
    main = get(3); alt = get(d);
    note = `You can train ${d} days, but the ${d}-day programs are written for people with a year or more of training. Start with this 3-day, use the other days for walking or easy cardio, and step up to the ${d}-day once the weights are moving well.`;
  } else if (!vet && d === 5 && g === "general") {
    main = get(3); alt = get(5);
    note = "The 5-day is built for people with a year or more of training. Start here and step up when you are ready.";
  } else if (vet && d <= 3) {
    alt = get(4);
    note = `These are the right sessions for a ${d}-day week. They are beginner-friendly, so push the weights harder than the notes suggest. If you can find a fourth day, the 4-day is the step up.`;
  } else if (vet && d === 4 && g === "general") {
    alt = get(5);
  } else if (d <= 3) {
    alt = get(d + 1);
  } else if (d === 4) {
    alt = get(5);
  } else {
    alt = get(4);
  }
  return { main, alt, note, d };
}

function card(p, isAlt) {
  const meta = [p.level === "beginner" ? "Beginner" : "Intermediate", p.weeks ? p.weeks + " weeks" : null, p.days + " days a week", p.minutes ? "About " + p.minutes + " min" : null].filter(Boolean);
  const pdf = p.stan === null ? "" : `<a class="btn btn-hero" href="${h(p.stan || STORE)}" target="_blank" rel="noopener">Get the PDF<span class="arr" aria-hidden="true">→</span></a>`;
  const inApp = `<a class="btn btn-ghost-ink" href="${APP}" target="_blank" rel="noopener">${p.stan === null ? "Start 7-day free trial in the app" : "Or follow it in the app, 7 days free"}<span class="arr" aria-hidden="true">→</span></a>`;
  return `<div class="card">
    <div class="lab">${isAlt ? "Step-up option" : "Your match"}</div>
    <h2 class="d">${h(p.title)}</h2>
    <p class="tag">${h(p.tagline)}</p>
    <div class="chips">${meta.map(m => `<span class="chip">${h(m)}</span>`).join("")}</div>
    <p class="blurb" style="margin-top:0;color:var(--bone)">${h(p.blurb)}</p>
    ${p.week.length ? `<ul class="week" aria-label="Your training week">${p.week.map((t, i) => `<li><span>Day ${i + 1}</span>${h(t)}</li>`).join("")}</ul>` : ""}
    <div class="cta">${pdf}${inApp}</div>
    <p class="mut" style="margin:14px 0 0;font-size:14px">${p.stan === null ? "" : "The PDF is a one-off purchase. "}App membership includes every program: 7 days free (card required), then $69 a year, $33.99 for 3 months or $16.99 a month. Logging your own workouts is always free.</p>
  </div>`;
}

function result({ main, alt, note, d }) {
  el.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:100%"></i></div>
    <div class="lab stepno">Your result</div>
    <h1 class="d" data-focus>Your ${GOALNAME[ans.goal].toLowerCase()} program</h1>
    <p class="mut sub">Based on your goal, your ${d}-day week and your training history.</p>
    ${note ? `<div class="note" style="background:var(--ink);margin-top:24px">${h(note)}</div>` : ""}
    ${card(main, false)}
    ${alt ? `<div class="alt"><div class="lab">${alt.days > main.days ? "Ready for more?" : "Prefer a different schedule?"}</div><p><b>${h(alt.title)}</b>. ${alt.days} days a week${alt.minutes ? ", about " + alt.minutes + " minutes a session" : ""}.</p><button type="button" class="linkbtn" id="showalt">See this program</button></div><div id="altslot"></div>` : ""}
    <div class="nav2"><button type="button" class="linkbtn" id="retake">Retake the quiz</button> &nbsp;·&nbsp; <a class="linkbtn" href="${STORE}" target="_blank" rel="noopener">Browse every program</a></div>`;
  const sa = document.getElementById("showalt"); if (sa) sa.addEventListener("click", () => { document.getElementById("altslot").innerHTML = card(alt, true); sa.remove(); });
  document.getElementById("retake").addEventListener("click", () => { step = 0; for (const k in ans) delete ans[k]; render(); window.scrollTo({ top: 0 }); });
  focusHeading();
}
render();
</script>
<script src="../site-chrome.js" defer></script>
