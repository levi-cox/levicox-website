<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Levi Cox Fitness – Reel Teleprompter</title>
<style>
:root{--bg:#0b0b0c;--panel:#161618;--line:#2a2a2e;--tx:#f4f4f5;--mut:#9a9aa2;--acc:#ff5a1f;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- Editor ---------- */
#editor{height:100%;display:flex;flex-direction:column;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));max-width:760px;margin:0 auto;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand b{letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.brand span{color:var(--mut);font-size:12px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
select{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.btn:active{background:#202024}
.btn.danger{color:#ff8a80}
textarea{flex:1;min-height:0;width:100%;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:16px;font:inherit;font-size:17px;line-height:1.5;outline:none}
textarea:focus{border-color:#45454c}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.hint{color:var(--mut);font-size:12.5px;line-height:1.4}
.cta{background:var(--acc);border:0;color:#fff;border-radius:14px;padding:16px;font-size:17px;font-weight:700;letter-spacing:.02em}
.cta:active{filter:brightness(.9)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.opt input{accent-color:var(--acc);width:18px;height:18px}

/* ---------- Prompter ---------- */
#prompter{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:1}
#shade{position:absolute;inset:0;background:#000;opacity:.65;pointer-events:none}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#mirror{position:absolute;inset:0}
#text{position:absolute;left:0;right:0;top:0;padding:0 8vw;font-weight:700;line-height:1.35;white-space:pre-wrap;word-break:break-word;text-align:center;will-change:transform;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#text .cue{color:var(--acc);font-weight:600;font-size:.6em;letter-spacing:.08em;text-transform:uppercase}
#line{position:absolute;left:0;right:0;height:0;border-top:2px solid rgba(255,90,31,.55);pointer-events:none}
#line::before{content:"";position:absolute;left:0;top:-9px;border:8px solid transparent;border-left:12px solid var(--acc)}
#line::after{content:"";position:absolute;right:0;top:-9px;border:8px solid transparent;border-right:12px solid var(--acc)}
#fadeT,#fadeB{position:absolute;left:0;right:0;pointer-events:none;height:18%}
#fadeT{top:0;background:linear-gradient(#000,transparent)}
#fadeB{bottom:0;background:linear-gradient(transparent,#000)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;color:#fff;background:rgba(0,0,0,.5);pointer-events:none}

#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));background:linear-gradient(transparent,rgba(0,0,0,.92) 35%);display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
#bar.dim{opacity:0;pointer-events:none}
.ctl{display:flex;align-items:center;gap:10px}
.ctl label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;width:46px;flex:none}
.ctl input[type=range]{flex:1;accent-color:var(--acc)}
.ctl .v{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
.main{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 14px;font-size:14px;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc)}
.play{width:68px;height:68px;border-radius:50%;background:#fff;color:#000;border:0;font-size:26px;display:grid;place-items:center;flex:none}
.rec{width:68px;height:68px;border-radius:50%;background:transparent;border:4px solid #fff;display:grid;place-items:center;flex:none;padding:0}
.rec i{width:46px;height:46px;border-radius:50%;background:#e5252a;transition:all .15s}
.rec.on i{width:26px;height:26px;border-radius:6px}
#status{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#status>*{pointer-events:auto}
#timer{font-variant-numeric:tabular-nums;font-size:14px;background:rgba(0,0,0,.55);border-radius:999px;padding:6px 12px}
#timer.rec{background:#e5252a}
#toast{position:absolute;left:16px;right:16px;top:calc(56px + var(--safe-t));background:rgba(20,20,22,.95);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.4}
#done{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#done video{max-height:55vh;max-width:90vw;border-radius:12px;background:#111}
a.cta{text-decoration:none;display:inline-block}
</style>
</head>
<body>

<!-- ================= EDITOR ================= -->
<div id="editor">
  <div class="brand"><b>Levi Cox Fitness</b><span>Reel teleprompter</span></div>
  <h1>Script</h1>

  <div class="row">
    <select id="scriptSel" aria-label="Saved scripts"></select>
    <button class="btn" id="newBtn">New</button>
    <button class="btn danger" id="delBtn">Delete</button>
  </div>
  <input type="text" id="titleIn" placeholder="Script title (e.g. 3 cues for a better squat)">

  <textarea id="scriptIn" placeholder="Paste or write your script here.&#10;&#10;Put stage directions in [brackets] — e.g. [pause], [point to camera], [cut to demo] — they show up small and orange so you don't read them out."></textarea>

  <div class="meta"><span id="wc">0 words</span><span id="dur">~0s at speaking pace</span></div>

  <div class="opts">
    <label class="opt"><input type="checkbox" id="optCam"> Camera behind text</label>
    <label class="opt"><input type="checkbox" id="optMirror"> Mirror text (glass rig)</label>
  </div>

  <button class="cta" id="startBtn">Start prompter</button>
  <div class="hint">Tap the screen while it's running to pause. Space = play/pause, ↑/↓ = nudge, ←/→ = speed. Scripts save in this browser automatically.</div>
</div>

<!-- ================= PROMPTER ================= -->
<div id="prompter" class="hidden">
  <video id="cam" playsinline muted class="hidden"></video>
  <div id="shade"></div>
  <div id="stage"><div id="mirror"><div id="text"></div></div></div>
  <div id="fadeT"></div><div id="fadeB"></div>
  <div id="line"></div>
  <div id="count" class="hidden"></div>

  <div id="status">
    <button class="pill" id="exitBtn">← Edit</button>
    <span id="timer">0:00</span>
  </div>
  <div id="toast" class="hidden"></div>

  <div id="bar">
    <div class="ctl"><label>Speed</label><input type="range" id="speed" min="1" max="30" step="1"><span class="v" id="speedV"></span></div>
    <div class="ctl"><label>Size</label><input type="range" id="size" min="24" max="96" step="2"><span class="v" id="sizeV"></span></div>
    <div class="ctl" id="shadeRow"><label>Dim</label><input type="range" id="dim" min="0" max="90" step="5"><span class="v" id="dimV"></span></div>
    <div class="main">
      <button class="pill" id="mirrorBtn">Mirror</button>
      <button class="pill" id="restartBtn">⟲ Top</button>
      <button class="play" id="playBtn" aria-label="Play or pause">▶</button>
      <button class="rec hidden" id="recBtn" aria-label="Record"><i></i></button>
      <button class="pill" id="camBtn">Camera</button>
    </div>
  </div>
</div>

<div id="done" class="hidden">
  <div style="font-weight:700;font-size:18px">Take saved</div>
  <video id="preview" controls playsinline></video>
  <div class="row" style="justify-content:center">
    <a class="cta" id="dl" download="reel-take.webm">Download take</a>
    <button class="btn" id="doneClose">Back to prompter</button>
  </div>
  <div class="hint" id="dlHint"></div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var LS = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };

  /* ---------- State ---------- */
  var scripts = LS.get('lcf_scripts', null);
  if(!scripts||!scripts.length){
    scripts=[{id:Date.now(),title:'Sample reel',body:"Most people squat wrong. [pause]\n\nHere's the one cue that fixes it in ten seconds.\n\n[point to camera]\n\nSpread the floor with your feet, keep your ribcage stacked over your hips, and sit between your legs — not behind them.\n\n[cut to demo]\n\nTry it on your next set and tell me what you feel. Follow for more."}];
  }
  var cur = LS.get('lcf_cur', scripts[0].id);
  if(!scripts.some(function(s){return s.id===cur})) cur=scripts[0].id;
  var settings = LS.get('lcf_settings',{speed:8,size:56,dim:65,mirror:false,cam:false});

  function save(){LS.set('lcf_scripts',scripts);LS.set('lcf_cur',cur);LS.set('lcf_settings',settings)}
  function active(){return scripts.filter(function(s){return s.id===cur})[0]}

  /* ---------- Editor ---------- */
  function refreshSelect(){
    var sel=$('scriptSel');sel.innerHTML='';
    scripts.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.title||'Untitled';if(s.id===cur)o.selected=true;sel.appendChild(o)});
  }
  function loadActive(){var s=active();$('titleIn').value=s.title;$('scriptIn').value=s.body;stats()}
  function stats(){
    var t=$('scriptIn').value.replace(/\[[^\]]*\]/g,' ');
    var w=(t.match(/\S+/g)||[]).length;
    $('wc').textContent=w+' words';
    var sec=Math.round(w/150*60);
    $('dur').textContent='~'+(sec>=60?Math.floor(sec/60)+'m '+(sec%60)+'s':sec+'s')+' at speaking pace';
  }
  $('scriptSel').onchange=function(){cur=+this.value;save();loadActive()};
  $('titleIn').oninput=function(){active().title=this.value;save();var o=$('scriptSel').selectedOptions[0];if(o)o.textContent=this.value||'Untitled'};
  $('scriptIn').oninput=function(){active().body=this.value;save();stats()};
  $('newBtn').onclick=function(){var s={id:Date.now(),title:'New script',body:''};scripts.unshift(s);cur=s.id;save();refreshSelect();loadActive();$('scriptIn').focus()};
  $('delBtn').onclick=function(){
    if(scripts.length<2){active().body='';active().title='New script';save();refreshSelect();loadActive();return}
    if(!$('delBtn').dataset.sure){$('delBtn').dataset.sure=1;$('delBtn').textContent='Tap again';setTimeout(function(){delete $('delBtn').dataset.sure;$('delBtn').textContent='Delete'},2500);return}
    scripts=scripts.filter(function(s){return s.id!==cur});cur=scripts[0].id;delete $('delBtn').dataset.sure;$('delBtn').textContent='Delete';save();refreshSelect();loadActive();
  };
  $('optCam').checked=settings.cam;$('optMirror').checked=settings.mirror;
  $('optCam').onchange=function(){settings.cam=this.checked;save()};
  $('optMirror').onchange=function(){settings.mirror=this.checked;save()};

  /* ---------- Prompter ---------- */
  var pos=0, playing=false, last=0, raf=0, offset=0, maxPos=0;
  var textEl=$('text'), stage=$('stage');

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function render(){
    var html=esc(active().body||'(empty script)').replace(/\[([^\]]*)\]/g,'<span class="cue">[$1]</span>');
    textEl.innerHTML=html;
    textEl.style.fontSize=settings.size+'px';
    layout();
  }
  function layout(){
    var h=stage.clientHeight;
    offset=Math.round(h*0.38);
    $('line').style.top=offset+'px';
    maxPos=textEl.offsetHeight+offset*0.4;
    apply();
  }
  function apply(){textEl.style.transform='translate3d(0,'+(offset-pos)+'px,0)'}
  function setMirror(){$('mirror').style.transform=settings.mirror?'scaleX(-1)':'none';$('mirrorBtn').classList.toggle('on',settings.mirror)}
  function setDim(){$('shade').style.opacity=settings.dim/100}

  function tick(t){
    if(!playing)return;
    var dt=Math.min(.05,(t-last)/1000);last=t;
    pos+=settings.speed*10*dt;
    if(pos>=maxPos){pos=maxPos;apply();pause(true);return}
    apply();raf=requestAnimationFrame(tick);
  }
  function play(){if(playing)return;playing=true;last=performance.now();$('playBtn').textContent='❚❚';raf=requestAnimationFrame(tick);hideBarSoon()}
  function pause(){playing=false;cancelAnimationFrame(raf);$('playBtn').textContent='▶';showBar()}
  function toggle(){playing?pause():play()}

  var barTimer;
  function showBar(){$('bar').classList.remove('dim');clearTimeout(barTimer)}
  function hideBarSoon(){clearTimeout(barTimer);barTimer=setTimeout(function(){if(playing)$('bar').classList.add('dim')},3500)}

  /* sliders */
  function syncSliders(){
    $('speed').value=settings.speed;$('speedV').textContent=settings.speed;
    $('size').value=settings.size;$('sizeV').textContent=settings.size;
    $('dim').value=settings.dim;$('dimV').textContent=settings.dim;
  }
  $('speed').oninput=function(){settings.speed=+this.value;$('speedV').textContent=this.value;save();hideBarSoon()};
  $('size').oninput=function(){
    var frac=pos/Math.max(1,textEl.offsetHeight);
    settings.size=+this.value;$('sizeV').textContent=this.value;textEl.style.fontSize=this.value+'px';
    layout();pos=frac*textEl.offsetHeight;apply();save();hideBarSoon();
  };
  $('dim').oninput=function(){settings.dim=+this.value;$('dimV').textContent=this.value;setDim();save()};
  $('mirrorBtn').onclick=function(){settings.mirror=!settings.mirror;setMirror();save()};
  $('restartBtn').onclick=function(){pause();pos=0;apply()};
  $('playBtn').onclick=toggle;

  /* tap to pause / drag to scrub */
  var drag=null;
  stage.addEventListener('pointerdown',function(e){drag={y:e.clientY,p:pos,moved:false};stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',function(e){
    if(!drag)return;var dy=e.clientY-drag.y;
    if(Math.abs(dy)>6)drag.moved=true;
    if(drag.moved){pos=Math.max(0,Math.min(maxPos,drag.p-dy));apply()}
  });
  stage.addEventListener('pointerup',function(){
    if(drag&&!drag.moved){ if($('bar').classList.contains('dim')&&playing){showBar();hideBarSoon()} else toggle() }
    drag=null;
  });
  stage.addEventListener('wheel',function(e){e.preventDefault();pos=Math.max(0,Math.min(maxPos,pos+e.deltaY));apply()},{passive:false});
  window.addEventListener('resize',function(){if(!$('prompter').classList.contains('hidden'))layout()});

  document.addEventListener('keydown',function(e){
    if($('prompter').classList.contains('hidden'))return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.code==='ArrowUp'){e.preventDefault();pos=Math.max(0,pos-60);apply()}
    else if(e.code==='ArrowDown'){e.preventDefault();pos=Math.min(maxPos,pos+60);apply()}
    else if(e.code==='ArrowRight'){settings.speed=Math.min(30,settings.speed+1);syncSliders();save()}
    else if(e.code==='ArrowLeft'){settings.speed=Math.max(1,settings.speed-1);syncSliders();save()}
    else if(e.code==='Escape'){exit()}
  });

  /* ---------- Camera + recording ---------- */
  var stream=null, recorder=null, chunks=[], recStart=0, timerI=0, camOK=false;

  function toast(msg,ms){var t=$('toast');t.textContent=msg;t.classList.remove('hidden');if(ms)setTimeout(function(){t.classList.add('hidden')},ms)}

  function camSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)}

  function startCam(){
    if(!camSupported()){toast("Camera isn't available in this view. Open the standalone file or your own https page to record in-app — or just film with your camera app while this scrolls.");setCamUI(false);return Promise.resolve()}
    return navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true}})
      .then(function(s){stream=s;var v=$('cam');v.srcObject=s;v.classList.remove('hidden');v.play().catch(function(){});setCamUI(true)})
      .catch(function(err){
        toast("Camera blocked here ("+(err&&err.name||'error')+"). The teleprompter still works — film with your camera app, or open this file in your own browser tab to record in-app.");
        setCamUI(false);
      });
  }
  function stopCam(){
    if(recorder&&recorder.state!=='inactive')recorder.stop();
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    $('cam').srcObject=null;$('cam').classList.add('hidden');setCamUI(false);
  }
  function setCamUI(on){
    camOK=on;settings.cam=on;$('camBtn').classList.toggle('on',on);
    $('recBtn').classList.toggle('hidden',!on);
    $('shadeRow').style.opacity=on?1:.4;
    $('optCam').checked=on;save();
  }
  $('camBtn').onclick=function(){camOK?stopCam():startCam()};

  function pickMime(){
    var c=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c[i]))return c[i]}
    return '';
  }
  function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

  function countdown(n){
    return new Promise(function(res){
      var c=$('count');c.classList.remove('hidden');
      (function step(){ if(n<=0){c.classList.add('hidden');res();return} c.textContent=n;n--;setTimeout(step,1000) })();
    });
  }

  function startRec(){
    if(!stream)return;
    $('bar').classList.add('dim');
    countdown(3).then(function(){
      chunks=[];var mime=pickMime();
      try{recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:undefined)}catch(e){toast('Recording not supported here.',4000);return}
      recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=function(){
        clearInterval(timerI);$('timer').classList.remove('rec');$('recBtn').classList.remove('on');
        if(!chunks.length)return;
        var type=recorder.mimeType||'video/webm';var blob=new Blob(chunks,{type:type});
        var url=URL.createObjectURL(blob);var ext=type.indexOf('mp4')>-1?'mp4':'webm';
        var name=(active().title||'reel').replace(/[^\w\-]+/g,'-').toLowerCase()+'-take.'+ext;
        $('preview').src=url;$('dl').href=url;$('dl').download=name;
        $('dlHint').textContent='If Download does nothing in this view, open the standalone file and record there. Your take is not stored anywhere else.';
        $('done').classList.remove('hidden');
      };
      recorder.start(1000);recStart=Date.now();
      $('recBtn').classList.add('on');$('timer').classList.add('rec');
      timerI=setInterval(function(){$('timer').textContent='● '+fmt(Date.now()-recStart)},250);
      pos=0;apply();play();
    });
  }
  function stopRec(){if(recorder&&recorder.state!=='inactive'){recorder.stop()}pause()}
  $('recBtn').onclick=function(){(recorder&&recorder.state==='recording')?stopRec():startRec()};
  $('doneClose').onclick=function(){$('done').classList.add('hidden');$('timer').textContent='0:00';$('preview').pause()};

  /* ---------- Navigation ---------- */
  function enter(){
    $('editor').classList.add('hidden');$('prompter').classList.remove('hidden');
    pos=0;syncSliders();setMirror();setDim();render();showBar();$('timer').textContent='0:00';
    $('toast').classList.add('hidden');
    $('shadeRow').style.opacity=.4;
    if($('optCam').checked)startCam();
    var el=document.documentElement;try{if(el.requestFullscreen)el.requestFullscreen().catch(function(){})}catch(e){}
  }
  function exit(){
    pause();stopCam();clearInterval(timerI);
    $('prompter').classList.add('hidden');$('editor').classList.remove('hidden');
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  }
  $('startBtn').onclick=enter;
  $('exitBtn').onclick=exit;

  refreshSelect();loadActive();
})();
</script>
</body>
</html>
